<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call to Gaza</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      text-align: center;
      background: #111;
      color: #fff;
      margin: 0;
    }
    button {
      background: #1db954;
      color: white;
      border: none;
      border-radius: 9999px;
      padding: 1em 2em;
      font-size: 1.2em;
      cursor: pointer;
      margin-top: 1em;
      transition: transform 0.2s ease;
    }
    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h2 id="message">🍉 Tap to call Gaza</h2>
  <button id="playButton">Call</button>
  <audio id="player"></audio>
  
  <script>
  const params = new URLSearchParams(window.location.search);
  const group = params.get("group") || "1";

  const group1 = ["LEEN_ENG.mp3", "ABDELKHARIM_ENG.mp3", "IBRAHIM_ENG.mp3"];
  const group2 = ["LEEN_FR.mp3", "ABDELKHARIM_FR.mp3", "IBRAHIM_FR.mp3"];
  const audios = group === "2" ? group2 : group1;

  const random = audios[Math.floor(Math.random() * audios.length)];

  const player = document.getElementById("player");
  const button = document.getElementById("playButton");
  const message = document.getElementById("message");

  // Sequence of sounds
  const callTone = new Audio("call_tone.mp3");
  const answerClick = new Audio("answer_click.mp3");
  const mainAudio = new Audio(random);

  button.addEventListener("click", () => {
    message.textContent = "🍉 Calling Gaza...";
    button.style.display = "none";

    // Play call tone first
    callTone.play();

    // After 3 seconds, stop the tone and play answer sound
    setTimeout(() => {
      callTone.pause();
      callTone.currentTime = 0;
      message.textContent = "🍉 Connected to Gaza...";
      answerClick.play();

      // When answer sound ends, play main audio
      answerClick.addEventListener("ended", () => {
        mainAudio.play().then(() => {
          message.textContent = "🍉 Connected to Gaza...";
        });
      });
    }, 10000); // 10000 seconds call tone
  });
</script>
</body>
</html>
