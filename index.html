<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Call to Gaza</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #111;
      color: #fff;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    h2 {
      margin-bottom: 1.5em;
      font-size: 1.4em;
    }
    button {
      background: #1db954;
      color: white;
      border: none;
      border-radius: 9999px;
      padding: 1em 2.5em;
      font-size: 1.2em;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    button:hover {
      transform: scale(1.05);
      background: #1ed760;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h2 id="message">🍉 Tap to call Gaza</h2>
  <button id="playButton">Call</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const group = params.get("group") || "1";

    const group1 = ["LEEN_ENG.mp3", "ABDELKHARIM_ENG.mp3", "IBRAHIM_ENG.mp3"];
    const group2 = ["LEEN_FR.mp3", "ABDELKHARIM_FR.mp3", "IBRAHIM_FR.mp3"];
    const audios = group === "2" ? group2 : group1;
    const random = audios[Math.floor(Math.random() * audios.length)];

    const message = document.getElementById("message");
    const button = document.getElementById("playButton");

    const callTone = new Audio("call_tone.mp3");
    const answerClick = new Audio("answer_click.mp3");
    const mainAudio = new Audio(random);

    callTone.preload = "auto";
    answerClick.preload = "auto";
    mainAudio.preload = "auto";

    callTone.volume = 1.0;
    answerClick.volume = 1.0;
    mainAudio.volume = 1.0;

    button.addEventListener("click", async () => {
      button.disabled = true;
      message.textContent = "🍉 Calling Gaza...";
      button.style.display = "none";

      // Unlock all audios quickly (no awaits = faster & more reliable)
      [callTone, answerClick, mainAudio].forEach(a => {
        a.play().then(() => {
          a.pause();
          a.currentTime = 0;
        }).catch(() => {});
      });

      // Wait a short moment to ensure everything’s unlocked
      setTimeout(async () => {
        try {
          // Play the call tone for 10 seconds
          await callTone.play();

          setTimeout(() => {
            callTone.pause();
            callTone.currentTime = 0;
            message.textContent = "🍉 Connected to Gaza...";

            // Small delay between tone stop and click
            setTimeout(async () => {
              try {
                await answerClick.play();
              } catch (err) {
                console.error("Click failed:", err);
              }

              answerClick.addEventListener("ended", async () => {
                try {
                  await mainAudio.play();
                } catch (err) {
                  console.error("Main audio failed:", err);
                }
              });
            }, 200); // short delay before click (0.2s)
          }, 10000); // 10 seconds call tone
        } catch (err) {
          console.error("Tone failed:", err);
          message.textContent = "⚠️ Unable to play audio. Tap again.";
          button.style.display = "inline-block";
          button.disabled = false;
        }
      }, 300); // delay start after unlocking (300ms)
    });
  </script>
</body>
</html>
