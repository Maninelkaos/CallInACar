<script>
  const params = new URLSearchParams(window.location.search);
  const group = params.get("group") || "1";

  const group1 = ["LEEN_ENG.mp3", "ABDELKHARIM_ENG.mp3", "IBRAHIM_ENG.mp3"];
  const group2 = ["LEEN_FR.mp3", "ABDELKHARIM_FR.mp3", "IBRAHIM_FR.mp3"];
  const audios = group === "2" ? group2 : group1;

  const random = audios[Math.floor(Math.random() * audios.length)];

  const player = document.getElementById("player");
  const button = document.getElementById("playButton");
  const message = document.getElementById("message");

  // Sequence of sounds
  const callTone = new Audio("call_tone.mp3");
  const answerClick = new Audio("answer_click.mp3");
  const mainAudio = new Audio(random);

  button.addEventListener("click", () => {
    message.textContent = "📞 Calling...";
    button.style.display = "none";

    // Play call tone first
    callTone.play();

    // After 3 seconds, stop the tone and play answer sound
    setTimeout(() => {
      callTone.pause();
      callTone.currentTime = 0;
      message.textContent = "📞 Connected...";
      answerClick.play();

      // When answer sound ends, play main audio
      answerClick.addEventListener("ended", () => {
        mainAudio.play().then(() => {
          message.textContent = "▶ Playing message...";
        });
      });
    }, 10000); // 10000 seconds call tone
  });
</script>
